<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Судоку · Sudoky</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="description" content="Вам прислали судоку — откройте, чтобы увидеть уровень и результат. Someone sent you a sudoku — open it to see the level and the result.">
<!-- the preview card in messengers: the same for every link (the page is static) -->
<meta property="og:site_name" content="Судоку · Sudoky">
<meta property="og:title" content="Вам прислали судоку · Someone sent you a sudoku">
<meta property="og:description" content="Откройте, чтобы увидеть уровень и результат. Open it to see the level and the result.">
<meta property="og:image" content="https://airatik2004.github.io/icon.png">
<meta property="og:type" content="website">
<style>
  :root { --bg:#F3F4F9; --card:#fff; --text:#1c1d26; --dim:#6b6e80; --accent:#3D5AFE; --onaccent:#fff; --line:#E1E4EE; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14151c; --card:#1f2029; --text:#ececf2; --dim:#9a9cb0; --accent:#8193FF; --onaccent:#14151c; --line:#2A2D3B; } }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, -apple-system, Roboto, sans-serif; }
  body { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:12px; }
  .card { position:relative; width:100%; max-width:400px; background:var(--card); border-radius:22px; padding:16px 16px 14px; }
  .head { display:flex; align-items:center; gap:12px; margin:0 62px 12px 0; }
  .head img { width:44px; height:44px; border-radius:12px; flex:none; }
  h1 { font-size:19px; line-height:1.2; margin:0; }
  .lang { position:absolute; top:14px; right:14px; font:12px system-ui, sans-serif; color:var(--dim); background:none; cursor:pointer;
          border:1px solid var(--line); border-radius:8px; padding:3px 7px; }
  .lang b { color:var(--accent); font-weight:700; }
  .lang span { margin:0 3px; opacity:.6; }
  .grid { display:grid; grid-template-columns:repeat(9,1fr); width:100%; max-width:min(100%, 52vh); aspect-ratio:1; margin:0 auto;
          border:2px solid var(--text); border-radius:6px; overflow:hidden; }
  .grid div { display:flex; align-items:center; justify-content:center; font:600 clamp(13px,4.4vw,19px) system-ui, sans-serif;
              border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .grid div.r { border-right:2px solid var(--text); }
  .grid div.b { border-bottom:2px solid var(--text); }
  .meta { text-align:center; font-size:13.5px; color:var(--dim); margin:8px 0 12px; }
  .meta b { color:var(--text); }
  p.lead { color:var(--dim); margin:0 0 14px; }
  a.btn { display:block; border-radius:999px; padding:13px 10px; font:600 15.5px system-ui, sans-serif; text-align:center; text-decoration:none; }
  .main { background:var(--accent); color:var(--onaccent); }
  .alt { color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); }
  .get { margin-top:12px; }
  .get .label { text-align:center; font-size:13px; color:var(--dim); margin-bottom:8px; }
  .row { display:flex; gap:8px; }
  .row a { flex:1; padding:11px 6px; font-size:14.5px; }
  .note { text-align:center; font-size:12px; color:var(--dim); margin-top:8px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main class="card">
  <button class="lang" id="switch" type="button"></button>
  <div class="head"><img src="/icon.png" alt=""><h1 id="title"></h1></div>
  <div class="grid" id="grid" hidden></div>
  <div class="meta" id="meta" hidden></div>
  <p class="lead" id="lead" hidden></p>
  <a class="btn main" id="open" href="#" hidden></a>
  <div class="get" id="get">
    <div class="label" id="getLabel"></div>
    <div class="row" id="stores"></div>
    <div class="note" id="apkNote"></div>
  </div>
</main>
<script>
(function () {
  var APK = 'https://airatik2004.github.io/sudoky.apk';
  var RUSTORE = 'https://www.rustore.ru/catalog/app/ru.sudoky';
  var TXT = {
    ru: {
      titleShared: 'Вам прислали судоку', titleChallenge: 'Побей моё время!', titlePlain: 'Судоку',
      leadPlain: 'Судоку без рекламы: 7 уровней, оценка сложности по шкале SE, тренировка приёмов, своё судоку.',
      noapp: 'Похоже, игры ещё нет — установите её, потом снова нажмите на ссылку.',
      open: 'Открыть в игре', getLabel: 'Нет игры? Установите:', getPlain: 'Установить:',
      apk: 'APK (GitHub)', rustore: 'RuStore',
      apkNote: 'APK ставится напрямую — Android спросит разрешение',
      other: 'EN',
      levels: ['Новичок', 'Лёгкий', 'Средний', 'Сложный', 'Эксперт', 'Мастер', 'Гроссмейстер', 'Для Димы'],
      friend: 'Друг', mistakes: 'ошибок', hints: 'подсказок', dec: ','
    },
    en: {
      titleShared: 'Someone sent you a sudoku', titleChallenge: 'Beat my time!', titlePlain: 'Sudoky',
      leadPlain: 'Sudoku without ads: 7 levels, difficulty on the SE scale, technique practice, your own puzzles.',
      noapp: 'It looks like you don\'t have the game yet — install it, then tap the link again.',
      open: 'Open in the game', getLabel: 'No game yet? Install it:', getPlain: 'Install:',
      apk: 'APK (GitHub)', rustore: 'RuStore (Russia)',
      apkNote: 'The APK installs directly — Android will ask for permission',
      other: 'RU',
      levels: ['Novice', 'Easy', 'Medium', 'Hard', 'Expert', 'Master', 'Grandmaster', 'For Dima'],
      friend: 'Friend', mistakes: 'mistakes', hints: 'hints', dec: '.'
    }
  };
  var q = location.search;
  var m = /[?&]c=([^&#]+)/.exec(q) || /^#(.+)$/.exec(location.hash);
  var code = m ? decodeURIComponent(m[1]).trim() : '';
  if (!/^[1-8]-[0-9A-Za-z]{12,60}(~\d{1,6}\.\d{1,3}\.\d{1,3})?$/.test(code)) code = '';
  var forced = /[?&]lang=(ru|en)/.exec(q);
  // the sender's nickname (from his profile): shown instead of «Друг»
  var nm = /[?&]n=([^&#]+)/.exec(q), nick = '';
  try { nick = nm ? decodeURIComponent(nm[1].replace(/\+/g, ' ')).replace(/[;~,|<>&"]/g, ' ').trim().slice(0, 20) : ''; } catch (e) { nick = ''; }
  var nav = (navigator.language || 'en').toLowerCase().slice(0, 2);
  var $ = function (id) { return document.getElementById(id); };
  var t, lang;
  // the language switch re-draws the page in place: going to a /s/ address would open the game (Android App Links)
  $('switch').onclick = function () {
    render(lang === 'ru' ? 'en' : 'ru');
    try { var u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u.pathname + u.search); } catch (e) { }
  };
  render(forced ? forced[1] : (['ru', 'uk', 'be', 'kk'].indexOf(nav) >= 0 ? 'ru' : 'en'));

  function render(l) {
  lang = l;
  t = TXT[lang];
  document.documentElement.lang = lang;
  ['stores', 'grid'].forEach(function (id) { $(id).innerHTML = ''; });
  ['grid', 'meta', 'lead', 'open'].forEach(function (id) { $(id).hidden = true; });

  // where to get the game: the APK (always the newest version) first, then the stores
  [{ key: 'apk', url: APK }, { key: 'rustore', url: RUSTORE }].forEach(function (s, i) {
    var a = document.createElement('a');
    a.className = 'btn ' + (i === 0 && !code ? 'main' : 'alt');
    a.href = s.url; a.textContent = t[s.key];
    if (s.key === 'apk') a.setAttribute('download', 'Sudoky.apk');
    $('stores').appendChild(a);
  });
  $('apkNote').textContent = t.apkNote;
  // «RU / EN»: the current language first and highlighted; a tap switches to the other one
  $('switch').innerHTML = '<b>' + lang.toUpperCase() + '</b><span>/</span>' + t.other;
  var self = location.origin + location.pathname;

  if (!code) {
    $('title').textContent = t.titlePlain;
    $('lead').textContent = t.leadPlain;
    $('lead').hidden = false;
    $('getLabel').textContent = t.getPlain;
    document.title = t.titlePlain;
    return;
  }
  $('title').textContent = code.indexOf('~') > 0 ? t.titleChallenge : t.titleShared;
  drawPuzzle(code);
  $('getLabel').textContent = t.getLabel;
  if (/[?&]noapp=1/.test(q)) { $('lead').textContent = t.noapp; $('lead').hidden = false; }
  var open = $('open');
  open.hidden = false;
  open.textContent = t.open;
  // Android: the game's own address sudoky://s/?c=… (the https link itself always stays in the browser);
  // without the game Chrome comes back here with noapp=1
  var back = self + '?c=' + encodeURIComponent(code) + (nick ? '&n=' + encodeURIComponent(nick) : '') + '&noapp=1&lang=' + lang;
  var extra = (/[?&]se=\d+/.test(q) ? '&' + q.match(/se=\d+/)[0] : '') + (/[?&]d=\d+/.test(q) ? '&' + q.match(/d=\d+/)[0] : '');
  if (nick) extra += '&n=' + encodeURIComponent(nick);
  open.href = /Android/i.test(navigator.userAgent)
    ? 'intent://s/?c=' + encodeURIComponent(code) + extra +
      '#Intent;scheme=sudoky;package=ru.sudoky;S.browser_fallback_url=' + encodeURIComponent(back) + ';end'
    : '#get';

  }

  /**
   * The code as in the game (PuzzleCode): "<level 1..8>-<base36>[~seconds.errors.hints]". Read from the last cell:
   * a bit 1 = a given whose digit-1 comes next in base 9, a bit 0 = an empty cell; what is left must be 1.
   */
  function esc(x) { return x.replace(/[&<>"']/g, function (ch) { return '&#' + ch.charCodeAt(0) + ';'; }); }

  function decode(c) {
    var t2 = c.indexOf('~'), res = null;
    if (t2 > 0) { res = c.slice(t2 + 1).split('.').map(Number); c = c.slice(0, t2); }
    var n = 0n, s = c.slice(2).toLowerCase();
    for (var i = 0; i < s.length; i++) n = n * 36n + BigInt(parseInt(s[i], 36));
    var p = new Array(81).fill(0);
    for (var k = 80; k >= 0; k--) {
      var bit = n % 2n; n /= 2n;
      if (bit) { p[k] = Number(n % 9n) + 1; n /= 9n; }
    }
    if (n !== 1n) return null;
    return { level: parseInt(c[0], 10) - 1, cells: p, res: res };
  }
  /** The grid, then one or two lines: «Средний · SE 3,0 (3)» and the friend's result. */
  function drawPuzzle(c) {
    var d;
    try { d = decode(c); } catch (e) { d = null; }
    if (!d) return;
    var g = $('grid');
    for (var k = 0; k < 81; k++) {
      var cell = document.createElement('div');
      var col = k % 9, row = (k / 9) | 0;
      if (col === 2 || col === 5) cell.className += ' r';
      if (row === 2 || row === 5) cell.className += ' b';
      if (d.cells[k]) cell.textContent = d.cells[k];
      g.appendChild(cell);
    }
    g.hidden = false;
    var line = t.levels[d.level] ? '<b>' + t.levels[d.level] + '</b>' : '';
    // the game adds &se=<tenths>&d=<key moves> to the link: «SE 3,0 (3)» as in the game
    var se = /[?&]se=(\d{1,3})/.exec(q), dn = /[?&]d=(\d{1,2})/.exec(q);
    if (se) {
      var r = +se[1], txt = r >= 105 ? '10+' : r >= 90 ? '9+' : r >= 80 ? '8+' : r === 70 ? '7+' : Math.floor(r / 10) + t.dec + (r % 10);
      line += (line ? ' · ' : '') + 'SE <b>' + txt + '</b>' + (dn && +dn[1] > 0 ? ' (' + dn[1] + ')' : '');
    }
    var lines = line ? [line] : [];
    if (d.res && d.res.length === 3) {
      var sec = d.res[0], mm = Math.floor(sec / 60), ss = sec % 60;
      lines.push((nick ? esc(nick) : t.friend) + ': <b>' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss + '</b> · '
        + t.mistakes + ' ' + d.res[1] + ' · ' + t.hints + ' ' + d.res[2]);
    }
    $('meta').innerHTML = lines.join('<br>');
    $('meta').hidden = lines.length === 0;
  }
})();
</script>
</body>
</html>
