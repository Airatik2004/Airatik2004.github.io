<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Судоку · Sudoky</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="description" content="Судоку без рекламы: 7 уровней, оценка по шкале SE, тренировка приёмов. Sudoku without ads: 7 levels, SE ratings, technique practice.">
<style>
  :root { --bg:#F3F4F9; --card:#fff; --text:#1c1d26; --dim:#6b6e80; --accent:#3D5AFE; --onaccent:#fff; --line:#E1E4EE; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14151c; --card:#1f2029; --text:#ececf2; --dim:#9a9cb0; --accent:#8193FF; --onaccent:#14151c; --line:#2A2D3B; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font:16px/1.45 system-ui, -apple-system, Roboto, sans-serif; padding:20px; }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:24px; padding:28px 22px; text-align:center; }
  .logo { display:block; width:76px; height:76px; margin:0 auto 14px; border-radius:20px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p { margin:0 0 18px; color:var(--dim); }
  a.btn, button { display:block; width:100%; border:0; border-radius:999px; padding:14px; font:600 16px system-ui, sans-serif;
                  text-decoration:none; cursor:pointer; margin-top:10px; }
  .main { background:var(--accent); color:var(--onaccent); }
  .alt { background:transparent; color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); }
  .get { margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }
  .get h2 { font-size:15px; margin:0 0 4px; }
  small { color:var(--dim); display:block; margin-top:8px; font-size:13px; }
  .code b { display:block; word-break:break-all; font:600 15px ui-monospace, monospace; margin-top:6px; }
  .lang { margin-top:18px; font-size:13px; }
  .lang a { color:var(--dim); }
  .grid { display:grid; grid-template-columns:repeat(9,1fr); width:100%; max-width:330px; aspect-ratio:1; margin:4px auto 6px;
          border:2px solid var(--text); border-radius:6px; overflow:hidden; background:var(--card); }
  .grid div { display:flex; align-items:center; justify-content:center; font:600 clamp(14px,4.6vw,20px) system-ui, sans-serif;
              border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .grid div.r { border-right:2px solid var(--text); }
  .grid div.b { border-bottom:2px solid var(--text); }
  .meta { font-size:14px; color:var(--dim); margin:0 0 14px; }
  .meta b { color:var(--text); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/icon.png" alt="">
  <h1 id="title"></h1>
  <div class="grid" id="grid" hidden></div>
  <p class="meta" id="meta" hidden></p>
  <p id="lead"></p>
  <a class="btn main" id="open" href="#" hidden></a>
  <div class="get" id="get">
    <h2 id="getTitle"></h2>
    <small id="getNote"></small>
    <!-- stores: add new ones here, in the STORES list below -->
    <div id="stores"></div>
    <small id="apkNote"></small>
  </div>
  <div class="get code" id="codeBox" hidden>
    <small id="codeNote"></small>
    <b id="code"></b>
    <button class="alt" id="copy"></button>
  </div>
  <div class="lang"><a href="#" id="switch"></a></div>
</main>
<script>
(function () {
  var APK = 'https://airatik2004.github.io/sudoky.apk';
  var RUSTORE = 'https://www.rustore.ru/catalog/app/ru.sudoky';
  var TXT = {
    ru: {
      titleShared: 'Вам прислали судоку', titleChallenge: 'Побей моё время!', titlePlain: 'Судоку',
      lead: 'Откройте её в игре «Судоку». Если игры ещё нет — установите её, это бесплатно и без рекламы.',
      leadPlain: 'Судоку без рекламы: 7 уровней, оценка сложности по шкале SE, тренировка приёмов, своё судоку.',
      open: 'Открыть в игре', getTitle: 'Установить игру', getNote: 'Выберите, откуда:',
      apk: 'Скачать APK (GitHub)', rustore: 'RuStore',
      apkNote: 'APK — файл для установки напрямую: Android спросит разрешение на установку из этого источника.',
      noapp: 'Похоже, игра ещё не установлена — установите её ниже, потом снова нажмите на ссылку.',
      codeNote: 'В версии 1.0 код вводится вручную: «Своё судоку» → «Решить по коду».',
      copy: 'Скопировать код', copied: 'Скопировано ✓', other: 'English',
      levels: ['Новичок', 'Лёгкий', 'Средний', 'Сложный', 'Эксперт', 'Мастер', 'Гроссмейстер', 'Для Димы'],
      level: 'Уровень', result: 'Результат друга', mistakes: 'ошибок', hints: 'подсказок',
      depth: 'Глубина SE', density: 'плотность', dec: ','
    },
    en: {
      titleShared: 'Someone sent you a sudoku', titleChallenge: 'Beat my time!', titlePlain: 'Sudoky',
      lead: 'Open it in the Sudoky game. If you don\'t have it yet, install it — it is free and has no ads.',
      leadPlain: 'Sudoku without ads: 7 levels, difficulty on the SE scale, technique practice, your own puzzles.',
      open: 'Open in the game', getTitle: 'Get the game', getNote: 'Choose where from:',
      apk: 'Download the APK (GitHub)', rustore: 'RuStore (Russia)',
      apkNote: 'The APK is a file to install directly: Android will ask you to allow installing from this source.',
      noapp: 'It looks like the game is not installed yet — install it below, then tap the link again.',
      codeNote: '', copy: 'Copy the code', copied: 'Copied ✓', other: 'Русский',
      levels: ['Novice', 'Easy', 'Medium', 'Hard', 'Expert', 'Master', 'Grandmaster', 'For Dima'],
      level: 'Level', result: 'Friend\'s result', mistakes: 'mistakes', hints: 'hints',
      depth: 'SE depth', density: 'density', dec: '.'
    }
  };
  var q = location.search;
  var m = /[?&]c=([^&#]+)/.exec(q) || /^#(.+)$/.exec(location.hash);
  var code = m ? decodeURIComponent(m[1]).trim() : '';
  if (!/^[1-8]-[0-9A-Za-z]{12,60}(~\d{1,6}\.\d{1,3}\.\d{1,3})?$/.test(code)) code = '';
  var forced = /[?&]lang=(ru|en)/.exec(q);
  var nav = (navigator.language || 'en').toLowerCase().slice(0, 2);
  var lang = forced ? forced[1] : (['ru', 'uk', 'be', 'kk'].indexOf(nav) >= 0 ? 'ru' : 'en');
  var t = TXT[lang];
  document.documentElement.lang = lang;
  var $ = function (id) { return document.getElementById(id); };

  // where to get the game: the APK (always the newest version) first, then the stores
  var STORES = [{ key: 'apk', url: APK }, { key: 'rustore', url: RUSTORE }];
  STORES.forEach(function (s, i) {
    var a = document.createElement('a');
    a.className = 'btn ' + (i === 0 && !code ? 'main' : 'alt');
    a.href = s.url; a.textContent = t[s.key];
    if (s.key === 'apk') a.setAttribute('download', 'Sudoky.apk');
    $('stores').appendChild(a);
  });
  $('getTitle').textContent = t.getTitle;
  $('getNote').textContent = t.getNote;
  $('apkNote').textContent = t.apkNote;

  var self = location.origin + location.pathname;
  var other = lang === 'ru' ? 'en' : 'ru';
  $('switch').textContent = t.other;
  $('switch').href = self + '?' + (code ? 'c=' + encodeURIComponent(code) + '&' : '') + 'lang=' + other;

  if (!code) {
    $('title').textContent = t.titlePlain;
    $('lead').textContent = t.leadPlain;
    document.title = t.titlePlain;
    return;
  }
  $('title').textContent = code.indexOf('~') > 0 ? t.titleChallenge : t.titleShared;
  drawPuzzle(code);
  $('lead').textContent = /[?&]noapp=1/.test(q) ? t.noapp : t.lead;
  var open = $('open');
  open.hidden = false;
  open.textContent = t.open;
  // Android: open the game by its package; without the game Chrome comes back here with noapp=1
  var back = self + '?c=' + encodeURIComponent(code) + '&noapp=1' + (forced ? '&lang=' + lang : '');
  open.href = /Android/i.test(navigator.userAgent)
    ? 'intent://airatik2004.github.io/s/?c=' + encodeURIComponent(code) +
      '#Intent;scheme=https;package=ru.sudoky;S.browser_fallback_url=' + encodeURIComponent(back) + ';end'
    : '#get';

  // version 1.0 can't open links: its users type the code by hand. TODO: remove this block when 1.1 is in RuStore
  if (t.codeNote) {
    $('codeBox').hidden = false;
    $('codeNote').textContent = t.codeNote;
    $('code').textContent = code;
    var copy = $('copy');
    copy.textContent = t.copy;
    copy.onclick = function () {
      var done = function () { copy.textContent = t.copied; };
      if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, function () {});
      else { var r = document.createRange(); r.selectNode($('code'));
             getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); done(); }
    };
  }

  /**
   * The code as in the game (PuzzleCode): "<level 1..8>-<base36>[~seconds.errors.hints]". Read from the last cell:
   * a bit 1 = a given whose digit-1 comes next in base 9, a bit 0 = an empty cell; what is left must be 1.
   */
  function decode(c) {
    var t2 = c.indexOf('~'), res = null;
    if (t2 > 0) { res = c.slice(t2 + 1).split('.').map(Number); c = c.slice(0, t2); }
    var n = 0n, s = c.slice(2).toLowerCase();
    for (var i = 0; i < s.length; i++) n = n * 36n + BigInt(parseInt(s[i], 36));
    var p = new Array(81).fill(0);
    for (var k = 80; k >= 0; k--) {
      var bit = n % 2n; n /= 2n;
      if (bit) { p[k] = Number(n % 9n) + 1; n /= 9n; }
    }
    if (n !== 1n) return null;
    return { level: parseInt(c[0], 10) - 1, cells: p, res: res };
  }
  function drawPuzzle(c) {
    var d;
    try { d = decode(c); } catch (e) { d = null; }
    if (!d) return;
    var g = $('grid');
    for (var k = 0; k < 81; k++) {
      var cell = document.createElement('div');
      var col = k % 9, row = (k / 9) | 0;
      if (col === 2 || col === 5) cell.className += ' r';
      if (row === 2 || row === 5) cell.className += ' b';
      if (d.cells[k]) cell.textContent = d.cells[k];
      g.appendChild(cell);
    }
    g.hidden = false;
    var m = $('meta'), parts = [];
    if (t.levels[d.level]) parts.push(t.level + ': <b>' + t.levels[d.level] + '</b>');
    // the game adds &se=<tenths>&d=<key moves> to the link (as «SE 4,4 (2)» in the game)
    var se = /[?&]se=(\d{1,3})/.exec(q), dn = /[?&]d=(\d{1,2})/.exec(q);
    if (se) {
      var r = +se[1], txt = r >= 105 ? '10+' : r >= 90 ? '9+' : r >= 80 ? '8+' : r === 70 ? '7+' : Math.floor(r / 10) + t.dec + (r % 10);
      parts.push(t.depth + ': <b>' + txt + '</b>' + (dn && +dn[1] > 0 ? ', ' + t.density + ' ' + dn[1] : ''));
    }
    if (d.res && d.res.length === 3) {
      var sec = d.res[0], mm = Math.floor(sec / 60), ss = sec % 60;
      parts.push(t.result + ': <b>' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss + '</b> · '
        + t.mistakes + ' ' + d.res[1] + ' · ' + t.hints + ' ' + d.res[2]);
    }
    m.innerHTML = parts.join('<br>');
    m.hidden = parts.length === 0;
  }
})();
</script>
</body>
</html>
