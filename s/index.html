    drawTabIcon(b.firstChild, m, m === ui.mode && !ui.eraser, m === MODE_COLOR && ui.link ? 1 : 0);
  });
  $('bSpeed').textContent = ui.quick ? t.quick : t.slow;
  $('bSpeed').className = 'pill' + (ui.quick ? ' acc' : '');
  $('bUndo').className = 'pill' + (undoS.length && !g.status ? '' : ' off');
  $('bRedo').className = 'pill' + (redoS.length && !g.status ? '' : ' off');
  $('bErase').className = 'pill' + (ui.eraser ? ' filled' : '');
  // the eraser glyph as on the game's button: a tilted rounded block, its left part filled
  $('bErase').innerHTML = '<svg width="20" height="20" viewBox="-10 -10 20 20" style="margin-right:5px;flex:none"><g transform="rotate(-40)">' +
    '<clipPath id="ec"><rect x="-7.5" y="-4" width="6.3" height="8"/></clipPath>' +
    '<rect x="-7.5" y="-4" width="15" height="8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
    '<rect x="-7.5" y="-4" width="15" height="8" rx="2.2" fill="currentColor" clip-path="url(#ec)"/></g></svg>' + t.erase;
  var e = f(t.errors, g.errors), h2 = f(t.hints, g.hints);
  $('errs').innerHTML = (g.errors > 0 ? '<span style="color:var(--error)">' + e + '</span>' : e) + ' · ' + h2;
}
function drawTabIcon(c, m, on, link) {
  var x = c.getContext('2d'), s = 66, k = 3; x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, s, s); x.scale(k, k);
  var col = on ? C.accent : C.textDim; x.strokeStyle = col; x.lineWidth = 1.6; x.beginPath();
  x.moveTo(5, 1); x.arcTo(21, 1, 21, 21, 4); x.arcTo(21, 21, 1, 21, 4); x.arcTo(1, 21, 1, 1, 4); x.arcTo(1, 1, 21, 1, 4); x.closePath(); x.stroke();
  x.fillStyle = col; x.textAlign = 'center'; x.textBaseline = 'middle';
  if (m === MODE_CORNER) { x.font = '600 8.5px system-ui'; x.fillText('1', 6, 6.5); x.fillText('2', 11.5, 6.5); }
  else if (m === MODE_CENTER) { x.font = '600 8.5px system-ui'; x.fillText('12', 11, 11.5); }
  else if (m === MODE_ANSWER) { x.font = '600 15px system-ui'; x.fillText('1', 11, 12); }
  else if (link) linkIcon(x, 3, 3, 16, col);   // one colour, as the other tabs
  else for (var j = 0; j < 3; j++) { x.fillStyle = CELL[j + 1]; x.fillRect(3.6 + j * 6.4, 8.4, 5.2, 5.2); }
  c.nextSibling.textContent = [t.corner, t.center, t.answer, m === MODE_COLOR && ui.link ? t.link : t.color][m];
}

// ------------------------------------------------------------------ hint (three steps, as in the game)
function correctValues() { return g.value.map(function (v, i) { return g.wrong[i] ? 0 : v; }); }
function techName(h) { if (h[2] >= SX.T_HARDER) return ''; var k = h.length > 4 ? h[4] : 0; if (k > 0 && t.tech[k]) return t.tech[k]; return h[2] === SX.T_HIDDEN ? t.tech.hidden : t.tech.naked; }
function hintText(h) {
  var name = techName(h), more = name ? '<span class="more">' + t.hMore + '</span>' : '';
  if (hintNudge) return (name ? f(t.hNudge, name) : t.hNudgeGuess) + more;
  var unit = h[3] < 0 ? '' : h[3] < 9 ? t.unitRow : h[3] < 18 ? t.unitCol : t.unitBox, k = h.length > 4 ? h[4] : 0, msg;
  if (h[2] >= SX.T_HARDER) msg = t.hGuess; else if (k > 0) msg = f(t.hTech, name); else if (h[2] === SX.T_HIDDEN) msg = f(t.hHidden, unit); else msg = t.hNaked;
  return msg + '<br>' + t.hPress + more;
}
function onHint() {
  if (!started || paused || g.status) return;
  clearSel();   // the hint shows one cell
  if (pendingHint && hintNudge) { hintNudge = false; ui.sel = pendingHint[0]; banner(hintText(pendingHint)); save(); refresh(); return; }
  if (pendingHint && canAnswer(pendingHint[0])) { var c = pendingHint[0], d = pendingHint[1]; clearHint(); ui.sel = c; answer(c, d); if (g.status) { onWon(); return; } celebrate(c, d); afterChange(); return; }
  var h = SX.hint(correctValues(), g.solution); if (!h) return;
  g.hints++; pendingHint = h; hintNudge = true; banner(hintText(h)); save(); refresh();
}
function banner(html) { var b = $('banner'); b.innerHTML = html; b.style.display = html ? 'block' : 'none'; resize(); }
function clearHint() { pendingHint = null; hintNudge = false; hintCell = hintUnit = -1; if ($('banner').style.display !== 'none') banner(''); }

// ------------------------------------------------------------------ clock, saving
function tick() {
  var now = performance.now();
  if (running) { g.elapsed += now - lastTick; }
  lastTick = now;
  $('timer').textContent = fmt(g.elapsed);
}
setInterval(tick, 500);
function startClock() { if (!started || paused || g.status) return; running = true; lastTick = performance.now(); }
function stopClock() { tick(); running = false; }
document.addEventListener('visibilitychange', function () { if (document.hidden) { if (started && !paused && !g.status) showPause(); save(); } });
function save() {
  if (!started) return;
  try { localStorage.setItem(KEY, JSON.stringify({ v: g.value, k: g.corner, m: g.center, c: g.color, w: g.wrong, l: g.links, e: g.errors, h: g.hints, t: g.elapsed, s: g.status })); } catch (e) { }
}
var saved = null;
try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
if (saved && !saved.s) { g.value = saved.v; g.corner = saved.k; g.center = saved.m; g.color = saved.c; g.wrong = saved.w; g.links = saved.l || []; g.errors = saved.e; g.hints = saved.h; g.elapsed = saved.t; }
else saved = null;

// the game's own address with the progress: the game offers «Продолжить» (format: GameState from the browser, see the app)
function progressParam() {
  if (!started || g.status) return '';
  var v = '', m = '';
  for (var c = 0; c < 81; c++) { var x = g.value[c]; v += g.wrong[c] ? String.fromCharCode(96 + x) : x; m += ('00' + (g.center[c] & 0x3FE).toString(16)).slice(-3); }
  return [Math.round(g.elapsed), g.errors, g.hints, v, m, g.corner.join('_'), g.color.join('_'), g.links.join('_')].join('~');
}
function openInGame() {
  if (!ANDROID) { tip(t.onlyAndroid); return; }
  stopClock(); save();
  var extra = (nick ? '&n=' + encodeURIComponent(nick) : '') + (GSIG ? '&g=' + GSIG : '');
  var p = progressParam(); if (p) extra += '&p=' + encodeURIComponent(p);
  var back = location.origin + location.pathname + '?c=' + encodeURIComponent(code) + (nick ? '&n=' + encodeURIComponent(nick) : '') + (GSIG ? '&g=' + GSIG : '') + '&noapp=1&lang=' + lang;
  location.href = 'intent://s/?c=' + encodeURIComponent(code) + extra + '#Intent;scheme=sudoky;package=ru.sudoky;S.browser_fallback_url=' + encodeURIComponent(back) + ';end';
}
// the game is under review in RuStore: a note instead of the link (back: location.href = RUSTORE)
function rustore() { if (!ANDROID) { tip(t.onlyAndroid); return; } tip(t.ruReview, 4000); }
function apk() { if (started && !g.status) tip(t.afterApk, 9000); var a = document.createElement('a'); a.href = APK; a.download = 'Sudoky.apk'; document.body.appendChild(a); a.click(); a.remove(); }

// ------------------------------------------------------------------ cards: start, pause, solved, tip
var tipTimer = null;
function tip(msg, ms) { var x = $('tip'); x.textContent = msg; x.style.display = 'block'; clearTimeout(tipTimer); tipTimer = setTimeout(function () { x.style.display = 'none'; }, ms || 2600); x.onclick = function () { x.style.display = 'none'; }; }
function levelName() { return t.levels[g.level] || '?'; }
function friendName() { return nick || t.friend; }
/** The friend's name for the page: the developer's nickname (signed link) in gold. */
function fname() { return goldNick ? '<b style="color:' + C.gold + '">' + esc(friendName()) + '</b>' : esc(friendName()); }
function updateLevelLine() {
  // the level and the depth, the goal on its own line below (as in the game)
  var s = levelName() + (SE > 0 ? ' · SE ' + seText(SE) + (DEN > 0 ? ' (' + stepsText(DEN) + ')' : '') : '');
  $('lvl').innerHTML = esc(s) + (g.chMs >= 0 ? '<br>' + esc(f(t.goal, fmt(g.chMs))) : '');
}
function infoRows() {
  var r = '';
  if (nick) r += '<div class="r"><span>' + t.from + '</span><b>' + esc(nick) + '</b></div>';
  r += '<div class="r"><span>' + t.level + '</span><b>' + levelName() + '</b></div>';
  if (SE > 0) r += '<div class="r"><span>' + t.depth + '</span><b>' + seText(SE) + (DEN > 0 ? ' (' + stepsText(DEN) + ')' : '') + '</b></div>';
  if (g.chMs >= 0) {
    r += '<div class="r"><span>' + (nick ? f(t.ftimeNick, esc(nick)) : t.ftime) + '</span><b>' + fmt(g.chMs) + '</b></div>';
    r += '<div class="r"><span>' + t.mistakesL + '</span><b>' + g.chErr + '</b></div><div class="r"><span>' + t.hintsL + '</span><b>' + g.chHints + '</b></div>';
  }
  return '<div class="box">' + r + '</div>';
}
function langBtn() { return '<button class="lang" data-lang><b>' + lang.toUpperCase() + '</b><span>/</span>' + t.other + '</button>'; }
function wireLang(root, redraw) { var b = root.querySelector('[data-lang]'); if (b) b.onclick = function () { lang = lang === 'ru' ? 'en' : 'ru'; t = TX[lang];
  try { var u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u.pathname + u.search); } catch (e) { }
  staticTexts(); refresh(); updateLevelLine(); redraw(); }; }
function showStart() {
  var st = document.createElement('div'); st.id = 'start';
  var draw1 = function () {
    // compact, so the whole board stays in view above it
    var meta = levelName() + (SE > 0 ? ' · SE <b>' + seText(SE) + '</b>' + (DEN > 0 ? ' (' + stepsText(DEN) + ')' : '') : '');
    if (g.chMs >= 0) meta += '<br>' + f(t.chFriend, '<b>' + fmt(g.chMs) + '</b>', g.chErr, g.chHints, fname());
    st.innerHTML = '<div class="card" style="padding:12px 14px 10px"><div class="head"><img src="/icon.png" alt="" style="width:32px;height:32px;border-radius:9px"><h2 style="font-size:18px">' +
      (g.chMs >= 0 ? t.titleChallenge : t.titleShared) + '</h2>' + langBtn() + '</div>' +
      '<div class="info" style="margin-top:6px;font-size:13.5px">' + meta + '</div>' + (/[?&]noapp=1/.test(q) ? '<div class="note">' + t.noapp + '</div>' : '') +
      '<div class="btns" style="margin-top:10px;gap:6px"><button class="pill filled" id="sPlay" style="height:46px">' + (saved ? f(t.contHere, fmt(g.elapsed)) : t.playHere) + '</button>' +
      '<button class="pill acc" id="sOpen" style="height:44px">' + t.open + '</button>' +
      '<div class="two"><button class="pill" id="sApk" style="height:44px">' + t.apk + '</button><button class="pill" id="sRu" style="height:44px">' + t.rustore + '</button></div></div>' +
      '<div class="note" style="margin-top:6px">' + t.apkNote + '</div></div>';
    $('sPlay').onclick = function () { st.remove(); app.classList.remove('starting'); started = true; startClock(); save(); refresh(); resize(); };
    $('sOpen').onclick = openInGame; $('sApk').onclick = apk; $('sRu').onclick = rustore;
    wireLang(st, draw1);
    resize();
  };
  // the card stands under the board in place of the controls (they come once the game starts)
  app.classList.add('starting');
  app.insertBefore(st, $('banner').nextSibling); draw1();
}
function showPause() {
  if (!started || paused || g.status) return;
  stopClock(); paused = true; save();
  var o = document.createElement('div'); o.className = 'ov pause';
  var draw1 = function () {
    var ch = g.chMs >= 0 ? '<div class="info" style="color:var(--text);font-weight:600;margin-top:6px">' + f(t.chFriend, fmt(g.chMs), g.chErr, g.chHints, fname()) + '</div>' : '';
    o.innerHTML = '<div class="card" style="border:1.5px solid var(--line)"><div class="head c"><h2 style="text-align:center;font-size:30px">' + t.pauseTitle + '</h2>' + langBtn() + '</div>' +
      '<div class="info" style="margin-top:4px">' + levelName() + ' · ' + fmt(g.elapsed) + '</div>' + (SE > 0 ? '<div class="info">' + f(t.seLine, seText(SE)) + '</div>' : '') + ch +
      '<div class="btns" style="margin-top:18px"><button class="pill filled" id="pRes">' + t.resume + '</button><button class="pill acc" id="pAgain" style="margin-top:8px">' + t.again + '</button></div></div>' +
      '<div class="plates"><button class="pill" id="pApk">' + t.apk + '</button><button class="pill" id="pRu">' + t.rustore + '</button></div>' +
      '<div class="plates" style="margin-top:8px"><button class="pill acc" id="pApp">' + t.playApp + '</button></div>';
    $('pRes').onclick = function () { o.remove(); paused = false; startClock(); refresh(); };
    $('pAgain').onclick = function () { confirmBox(t.againQ, function () { o.remove(); restartGame(); }, t.againYes); };
    $('pApk').onclick = apk; $('pRu').onclick = rustore; $('pApp').onclick = openInGame; wireLang(o, draw1);
  };
  app.appendChild(o); draw1();
}
function onWon() {
  stopClock(); clearHint(); refresh(); save();
  var o = document.createElement('div'); o.className = 'ov win';
  var draw1 = function () {
    var ch = '';
    if (g.chMs >= 0) {
      var diff = Math.floor(g.elapsed / 1000) - Math.floor(g.chMs / 1000);
      var verdict = diff < 0 ? f(t.faster, fmt(-diff * 1000)) : diff > 0 ? f(t.slower, fmt(diff * 1000), fname()) : t.tie;
      ch = '<div class="info" style="color:' + (diff <= 0 ? 'var(--ok)' : 'var(--text)') + ';font-weight:600;margin-top:8px">' + f(t.chFriend, fmt(g.chMs), g.chErr, g.chHints, fname()) + '<br>' + verdict + '</div>';
    }
    o.innerHTML = '<div class="card"><div class="head c"><h2 style="text-align:center;font-size:32px;color:var(--accent)">' + t.solved + '</h2>' + langBtn() + '</div>' +
      '<div class="info" style="color:var(--text);font-size:17px;margin-top:6px">' + levelName() + ' · ' + fmt(g.elapsed) + '</div>' +
      '<div class="info">' + f(t.counts, g.errors, g.hints) + (SE > 0 ? '<br>' + f(t.seLine, seText(SE)) : '') + '</div>' + ch +
      '<div class="btns"><button class="pill filled" id="wOpen">' + t.open + '</button><div class="two"><button class="pill" id="wApk">' + t.apk + '</button>' +
      '<button class="pill" id="wRu">' + t.rustore + '</button></div></div><div class="note">' + t.apkNote + '</div></div>';
    $('wOpen').onclick = openInGame; $('wApk').onclick = apk; $('wRu').onclick = rustore; wireLang(o, draw1);
  };
  app.appendChild(o); draw1();
}
var confirmEl = null;
/** The same puzzle from the start (pause → «Начать заново»). */
function restartGame() {
  g.value = g.puzzle.slice(); g.corner = new Array(81).fill(''); g.center = new Array(81).fill(0); g.color = new Array(81).fill('');
  g.wrong = new Array(81).fill(false); g.links = []; g.errors = 0; g.hints = 0; g.elapsed = 0; g.status = 0;
  undoS = []; redoS = []; clearHint(); clearSel(); linkTail = -1; peekCell = -1;
  ui.mode = MODE_CORNER; ui.lastNote = MODE_CORNER; ui.quick = true; ui.link = true; ui.drawColor = 0; ui.qd = 0; ui.anchor = -1; ui.chosen = false; ui.eraser = false; ui.sel = -1; ui.peek = 0;
  paused = false; save(); startClock(); refresh();
}
function confirmBox(msg, yes, yesLabel) {
  var o = document.createElement('div'); o.className = 'ov win';
  o.innerHTML = '<div class="card"><div style="font-weight:600;font-size:16px">' + msg + '</div><div class="two" style="margin-top:14px"><button class="pill" id="cNo">' + t.cancel +
    '</button><button class="pill filled" id="cYes">' + (yesLabel || t.yes) + '</button></div></div>';
  app.appendChild(o); $('cNo').onclick = function () { o.remove(); }; $('cYes').onclick = function () { o.remove(); yes(); };
}
function staticTexts() {
  document.documentElement.lang = lang; document.title = (g.chMs >= 0 ? t.titleChallenge : t.titleShared) + ' · ' + (lang === 'ru' ? 'Судоку' : 'Sudoky');
  $('bMenu').textContent = t.menu; $('bNew').textContent = t.newGame; $('bPause').textContent = t.pause; $('bWrite').textContent = t.writeAll;
  $('bUndo').textContent = t.undo; $('bRedo').textContent = t.redo;
  if (pendingHint) banner(hintText(pendingHint));
}

// ------------------------------------------------------------------ keyboard: 1–9 and the numpad — a short press is a tap, holding is a long press
var keyTimers = {};
document.addEventListener('keydown', function (e) {
  var d = /^Digit([1-9])$/.exec(e.code) || /^Numpad([1-9])$/.exec(e.code);
  if (d) { e.preventDefault(); if (e.repeat || keyTimers[e.code]) return; var dg = +d[1];
    keyTimers[e.code] = { done: false, t: setTimeout(function () { keyTimers[e.code].done = true; if (ui.mode === MODE_COLOR) return; peekKey(dg); }, 300) }; return; }
  if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); eraserTap(); }
});
document.addEventListener('keyup', function (e) {
  var d = /^Digit([1-9])$/.exec(e.code) || /^Numpad([1-9])$/.exec(e.code), k = keyTimers[e.code];
  if (!d || !k) return; clearTimeout(k.t); delete keyTimers[e.code];
  if (!k.done) { var dg = +d[1]; if (ui.mode === MODE_COLOR) { if (dg <= 3) colorKey(dg); } else digitKey(dg); }
});

staticTexts(); updateLevelLine(); resize(); refresh(); showStart();

// the rating: after the first paint, at most 3 seconds (past that — the lower bound, as in the game)
setTimeout(function () {
  SE = SX.seRating(D.cells, 3000); DEN = SX.steps();
  updateLevelLine(); var st = $('start'); if (st && !started) { st.remove(); showStart(); }
}, 60);

// a link from the developer build: its signature (ECDSA P-256 over «sudoky|code|nickname») — the nickname then shows in gold
(function () {
  if (!GSIG || !nick || !window.crypto || !crypto.subtle) return;
  var hex = '04737db78cd9689b442ce0e113dd39b36e292b449c424f923dd51141b377fffcaf531f97b6a436d52ff21380f3371f00d837996ac78e0a30aefa41e175f49af5b8';
  var key = new Uint8Array(hex.match(/../g).map(function (h) { return parseInt(h, 16); }));
  var b64 = GSIG.replace(/-/g, '+').replace(/_/g, '/'); while (b64.length % 4) b64 += '=';
  var sig = Uint8Array.from(atob(b64), function (ch) { return ch.charCodeAt(0); });
  crypto.subtle.importKey('raw', key, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']).then(function (k) {
    return crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, k, sig, new TextEncoder().encode('sudoky|' + D.plain + '|' + nick));
  }).then(function (ok) {
    if (!ok) return; goldNick = true;
    var st = $('start'); if (st && !started) { st.remove(); showStart(); }
  }).catch(function () { });
})();

// ------------------------------------------------------------------ no puzzle in the link: the page of the game
function plainPage() {
  var tt = TX[lang];
  var app = $('app');
  app.innerHTML = '<div class="plain"><div class="card"><div class="head"><img src="/icon.png" alt=""><h2>' + tt.titlePlain + '</h2>' +
    '<button class="lang" id="lng"><b>' + lang.toUpperCase() + '</b><span>/</span>' + tt.other + '</button></div>' +
    '<p style="color:var(--dim)">' + tt.leadPlain + '</p><div class="note">' + tt.getPlain + '</div>' +
    '<div class="btns"><button class="pill filled" id="pa">' + tt.apk + '</button><button class="pill acc" id="pr">' + tt.rustore + '</button></div>' +
    '<div class="note">' + tt.apkNote + '</div></div></div>';
  app.style.overflow = 'auto';
  $('pa').onclick = function () { location.href = APK; }; $('pr').onclick = function () { location.href = RUSTORE; };
  $('lng').onclick = function () { lang = lang === 'ru' ? 'en' : 'ru'; plainPage(); };
}
})();
</script>
</body>
